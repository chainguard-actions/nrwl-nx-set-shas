name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        continue-on-error: true
        with:
          main-branch-name: main
          set-environment-variables-for-job: 'true'
          error-on-no-successful-workflow: 'false'
          last-successful-event: push

      - name: Assert action ran (outputs set, or failed gracefully on sentinel repo)
        env:
          BASE: ${{ steps.action.outputs.base }}
          HEAD: ${{ steps.action.outputs.head }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "base: $BASE"
          echo "head: $HEAD"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$BASE" ]; then
              echo "FAIL: action succeeded but base output is empty"
              exit 1
            fi
            if [ -z "$HEAD" ]; then
              echo "FAIL: action succeeded but head output is empty"
              exit 1
            fi
            echo "PASS: got base='$BASE' head='$HEAD'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
