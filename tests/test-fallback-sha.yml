name: Test explicit fallback SHA
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Get a known SHA to use as fallback
        id: get-sha
        run: |
          SHA=$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Using fallback SHA: $SHA"

      - id: action
        uses: .
        with:
          main-branch-name: 'main'
          error-on-no-successful-workflow: 'false'
          fallback-sha: ${{ steps.get-sha.outputs.sha }}
          set-environment-variables-for-job: 'true'
        continue-on-error: true

      - name: Assert base output matches fallback SHA or action failed gracefully
        env:
          BASE: ${{ steps.action.outputs.base }}
          HEAD: ${{ steps.action.outputs.head }}
          FALLBACK: ${{ steps.get-sha.outputs.sha }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "base: $BASE"
          echo "head: $HEAD"
          echo "fallback: $FALLBACK"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$BASE" ]; then
              echo "FAIL: action succeeded but base output is empty"
              exit 1
            fi
            if [ -z "$HEAD" ]; then
              echo "FAIL: action succeeded but head output is empty"
              exit 1
            fi
            echo "PASS: base=$BASE head=$HEAD"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
