name: Test error-on-no-successful-workflow mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - id: action
        uses: .
        with:
          main-branch-name: 'main'
          error-on-no-successful-workflow: 'true'
          set-environment-variables-for-job: 'false'
        continue-on-error: true

      - name: Assert action failed or succeeded with valid outputs
        env:
          BASE: ${{ steps.action.outputs.base }}
          HEAD: ${{ steps.action.outputs.head }}
          NO_PREV_BUILD: ${{ steps.action.outputs.noPreviousBuild }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "base: $BASE"
          echo "head: $HEAD"
          echo "noPreviousBuild: $NO_PREV_BUILD"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected when no successful workflow found and error-on-no-successful-workflow=true"
          elif [ "$OUTCOME" = "success" ]; then
            if [ -z "$BASE" ]; then
              echo "FAIL: action succeeded but base output is empty"
              exit 1
            fi
            if [ -z "$HEAD" ]; then
              echo "FAIL: action succeeded but head output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with base=$BASE head=$HEAD"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
